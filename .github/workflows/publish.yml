name: Publish

on:
  push:
    tags:
      - "providers/*/v*"

permissions: {}

env:
  ARTIFACT_TYPE: application/vnd.trakkin.provider.v1
  BINARY_TYPE: application/vnd.trakkin.provider.binary.v1
  METADATA_TYPE: application/vnd.trakkin.provider.metadata.v1+json
  REGISTRY_REPO: ghcr.io/trakkin/trakkin-community-providers-v1

jobs:
  context:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      provider: ${{ steps.context.outputs.provider }}
      version: ${{ steps.context.outputs.version }}
      platforms: ${{ steps.context.outputs.platforms }}
      matrix: ${{ steps.context.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sourcemeta/jsonschema@9d487862cfb2b9dc875a17f6e99e366a23569e04 # v16.9.0
      - id: context
        name: Read context
        run: |
          release=${GITHUB_REF_NAME#providers/}
          provider=${release%/v*}
          version=${release##*/v}

          [[ "$provider" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

          metadata="providers/$provider/provider.json"
          jsonschema validate --format-assertion schemas/provider-v1.schema.json "$metadata"

          metadata_version=$(jq -r .version "$metadata")
          [[ "$metadata_version" == "$version" ]]

          platforms=$(jq -cer '.platforms | join(",")' "$metadata")
          matrix=$(
            jq -cer '
              {
                include: [
                  .platforms[]
                  | if . == "linux/amd64" then
                      {platform: ., runner: "ubuntu-24.04", directory: "linux_amd64"}
                    elif . == "linux/arm64" then
                      {platform: ., runner: "ubuntu-24.04-arm", directory: "linux_arm64"}
                    else
                      error("unsupported build platform: \(.)")
                    end
                ]
              }
            ' "$metadata"
          )

          {
            echo "provider=$provider"
            echo "version=$version"
            echo "platforms=$platforms"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: [context]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build provider artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: providers/${{ needs.context.outputs.provider }}
          target: artifact
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist/${{ matrix.directory }},platform-split=false
          cache-from: type=gha,scope=${{ needs.context.outputs.provider }}-${{ matrix.directory }}
          cache-to: type=gha,mode=max,scope=${{ needs.context.outputs.provider }}-${{ matrix.directory }}
      - name: Prepare provider artifact
        env:
          DIRECTORY: ${{ matrix.directory }}
          PROVIDER: ${{ needs.context.outputs.provider }}
        run: |
          dir="dist/$DIRECTORY"
          [[ -x "$dir/provider" ]]
          install -Dm644 \
            "providers/$PROVIDER/provider.json" \
            "$dir/provider.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: providers-${{ matrix.directory }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [context, build]
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: providers-*
          path: dist
          merge-multiple: true
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: push
        name: Push OCI index
        env:
          PROVIDER: ${{ needs.context.outputs.provider }}
          VERSION: ${{ needs.context.outputs.version }}
          PLATFORMS: ${{ needs.context.outputs.platforms }}
        run: |
          repository="$REGISTRY_REPO"
          IFS=, read -ra platforms <<<"$PLATFORMS"
          ((${#platforms[@]} > 0))
          metadata="dist/${platforms[0]//\//_}/provider.json"
          provider_id=$(jq -er '.id' "$metadata")
          release="$provider_id-v$VERSION"
          refs=()
          annotations=(
            --annotation "org.opencontainers.image.title=$PROVIDER"
            --annotation "org.opencontainers.image.version=$VERSION"
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          while IFS= read -r annotation; do
            annotations+=(--annotation "$annotation")
          done < <(
            jq -r '
              to_entries[]
              | "dev.trakkin.provider.\(.key)=\(
                  .value
                  | if type == "string" then . else tojson end
                )"
            ' "$metadata"
          )
          for platform in "${platforms[@]}"; do
            dir="dist/${platform//\//_}"
            [[ -f "$dir/provider" && -f "$dir/provider.json" ]]

            os=${platform%%/*}
            arch=${platform#*/}

            tag="$provider_id-platform-$VERSION-${os}-${arch}"
            digest=$(
              cd "$dir"
              oras push --format 'go-template={{.digest}}' \
                --artifact-type "$ARTIFACT_TYPE" \
                --artifact-platform "$os/$arch" \
                "${annotations[@]}" \
                "$repository:$tag" \
                "provider.json:$METADATA_TYPE" \
                "provider:$BINARY_TYPE"
            )
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$digest")
          done

          oras manifest index create --artifact-type "$ARTIFACT_TYPE" \
            "${annotations[@]}" \
            "$repository:$release" "${refs[@]}"

          {
            echo "repository=$repository"
            echo "digest=$(oras resolve "$repository:$release")"
          } >>"$GITHUB_OUTPUT"
      - name: Attest OCI index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
