name: Publish

on:
  push:
    tags:
      - "providers/*/v*"

permissions: {}

env:
  ARTIFACT_TYPE: application/vnd.trakkin.provider.v1
  BINARY_TYPE: application/vnd.trakkin.provider.binary.v1
  METADATA_TYPE: application/vnd.trakkin.provider.metadata.v1+json
  REGISTRY: ghcr.io/trakkin/trakkin-community-providers-v1

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      provider: ${{ steps.context.outputs.provider }}
      version: ${{ steps.context.outputs.version }}
      platforms: ${{ steps.context.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sourcemeta/jsonschema@9d487862cfb2b9dc875a17f6e99e366a23569e04 # v16.9.0
      - id: context
        name: Read context
        run: |
          release=${GITHUB_REF_NAME#providers/}
          provider=${release%/v*}
          version=${release##*/v}

          [[ "$provider" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

          metadata="providers/$provider/provider.json"
          jsonschema validate --format-assertion schemas/provider-v1.schema.json "$metadata"

          metadata_version=$(jq -r .version "$metadata")
          [[ "$metadata_version" == "$version" ]]

          platforms=$(jq -cer '.platforms | join(",")' "$metadata")
          qemu_platforms=$(
            jq -cer '
              [.platforms[] | select(. != "linux/amd64") | split("/")[1]]
              | join(",")
            ' "$metadata"
          )

          {
            echo "provider=$provider"
            echo "version=$version"
            echo "platforms=$platforms"
            echo "qemu_platforms=$qemu_platforms"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: steps.context.outputs.qemu_platforms != ''
        with:
          platforms: ${{ steps.context.outputs.qemu_platforms }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build provider artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: providers/${{ steps.context.outputs.provider }}
          target: artifact
          platforms: ${{ steps.context.outputs.platforms }}
          outputs: type=local,dest=dist,platform-split=true
          cache-from: type=gha,scope=${{ steps.context.outputs.provider }}
          cache-to: type=gha,mode=max,scope=${{ steps.context.outputs.provider }}
      - name: Prepare provider artifact
        env:
          PROVIDER: ${{ steps.context.outputs.provider }}
        run: |
          while IFS= read -r platform; do
            dir="dist/${platform//\//_}"
            [[ -x "$dir/provider" ]]
            install -Dm644 \
              "providers/$PROVIDER/provider.json" \
              "$dir/provider.json"
          done < <(jq -r '.platforms[]' "providers/$PROVIDER/provider.json")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: providers
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build]
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: providers
          path: dist
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: push
        name: Push OCI index
        env:
          PROVIDER: ${{ needs.build.outputs.provider }}
          VERSION: ${{ needs.build.outputs.version }}
          PLATFORMS: ${{ needs.build.outputs.platforms }}
        run: |
          release="$PROVIDER.version.$VERSION"
          IFS=, read -ra platforms <<<"$PLATFORMS"
          ((${#platforms[@]} > 0))
          metadata="dist/${platforms[0]//\//_}/provider.json"
          refs=()
          annotations=(
            --annotation "org.opencontainers.image.title=$PROVIDER"
            --annotation "org.opencontainers.image.version=$VERSION"
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          while IFS= read -r annotation; do
            annotations+=(--annotation "$annotation")
          done < <(
            jq -r '
              to_entries[]
              | "dev.trakkin.provider.\(.key)=\(
                  .value
                  | if type == "string" then . else tojson end
                )"
            ' "$metadata"
          )
          for platform in "${platforms[@]}"; do
            dir="dist/${platform//\//_}"
            [[ -f "$dir/provider" && -f "$dir/provider.json" ]]

            os=${platform%%/*}
            arch=${platform#*/}

            tag="$PROVIDER.platform.$VERSION.${os}-${arch}"
            digest=$(
              cd "$dir"
              oras push --format 'go-template={{.digest}}' \
                --artifact-type "$ARTIFACT_TYPE" \
                --artifact-platform "$os/$arch" \
                "${annotations[@]}" \
                "$REGISTRY:$tag" \
                "provider.json:$METADATA_TYPE" \
                "provider:$BINARY_TYPE"
            )
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$digest")
          done

          oras manifest index create --artifact-type "$ARTIFACT_TYPE" \
            "${annotations[@]}" \
            "$REGISTRY:$release" "${refs[@]}"

          echo "digest=$(oras resolve "$REGISTRY:$release")" >>"$GITHUB_OUTPUT"
      - name: Attest OCI index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
