[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
"github:kjanat/actionlint" = "1.13.0"
"github:oras-project/oras" = "1.3.4"
"npm:actions-up" = "1.18.0"
node = "26.7.0"
"jsonschema" = "16.9.0"
rust = { version = "1.97.1", components = "rustfmt,clippy" }

[tasks.setup]
description = "Fetch every provider's dependencies"
run = [{ tasks = ["setup:fixture"] }]

[tasks."setup:fixture"]
dir = "providers/fixture"
run = "cargo fetch --locked"

[tasks.build]
description = "Build every community provider"
run = [{ tasks = ["build:fixture"] }]

[tasks."build:fixture"]
dir = "providers/fixture"
run = "docker buildx build --target artifact --output type=local,dest=../../dist/fixture ."

[tasks.format]
description = "Format every community provider"
run = [{ tasks = ["format:fixture"] }]

[tasks."format:fixture"]
dir = "providers/fixture"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint workflows and every community provider"
run = [{ tasks = ["lint:actions", "lint:metadata", "lint:fixture"] }]

[tasks."lint:actions"]
run = "actionlint"

[tasks."lint:metadata"]
run = [
  "jsonschema fmt --check schemas/provider-v1.schema.json",
  "jsonschema metaschema schemas/provider-v1.schema.json",
  "jsonschema lint --exclude simple_properties_identifiers schemas/provider-v1.schema.json",
  "jsonschema validate --format-assertion schemas/provider-v1.schema.json providers/*/provider.json",
]

[tasks."lint:fixture"]
dir = "providers/fixture"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --all-targets --all-features -- -D warnings",
]

[tasks.test]
description = "Test every community provider"
run = [{ tasks = ["test:fixture"] }]

[tasks."test:fixture"]
dir = "providers/fixture"
run = "cargo test --locked --all-features"

[tasks.update]
description = "Update tools and dependencies"
run = [
  { task = "update:tools" },
  { tasks = [
    "update:actions",
    "update:fixture",
  ] },
]

[tasks."update:actions"]
description = "Update and SHA-pin GitHub Actions dependencies"
run = "actions-up --yes"

[tasks."update:fixture"]
dir = "providers/fixture"
run = "cargo upgrade --incompatible allow --pinned allow"

[tasks."update:tools"]
run = "mise upgrade --bump"
