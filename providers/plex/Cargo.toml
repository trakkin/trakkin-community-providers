[package]
description = "Plex Media Server provider for Trakkin"
edition = "2024"
license = "Apache-2.0"
name = "trakkin-provider-plex"
publish = false
repository = "https://github.com/trakkin/trakkin-community-providers"
rust-version = "1.97.1"
version = "0.0.0"

[workspace]

[dependencies]
prost = "0.14.3"
prost-types = "0.14.3"
reqwest = { version = "0.12.28", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = "0.14.6"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }
trakkin-provider-sdk = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "0ab27764ba736ca4f6404a54a50266611537070d", version = "0.0.0" }

[dev-dependencies]
serde_json = "1.0.149"
wiremock = "0.6.5"