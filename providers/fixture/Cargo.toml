[package]
description = "Fixture provider for the Trakkin provider protocol"
edition = "2024"
license = "Apache-2.0"
name = "trakkin-provider-fixture"
publish = false
repository = "https://github.com/trakkin/trakkin-community-providers"
rust-version = "1.97.1"
version = "0.0.0"

[workspace]

[dependencies]
prost-types = "0.14.4"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = "0.14.6"
tracing = "0.1.44"
trakkin-provider-sdk = { git = "https://github.com/trakkin/trakkin-contracts.git", rev = "6c2a576625e3c99491e45b7485a9aa0f99e69cb5", version = "0.0.0" }

[dev-dependencies]
serde_json = "1.0.150"
